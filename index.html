<style>
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at 50% 40%, #2a201a, #100b09 75%);
    display: flex; align-items: center; justify-content: center;
    animation: splashOut .5s ease 1.5s forwards;
  }
  #splash-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #splash-logo { width: 128px; height: 128px; filter: drop-shadow(0 0 18px rgba(224,178,78,.35)); }
  #splash-path {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.2s cubic-bezier(.6,.05,.3,.95) forwards, glow 1.6s ease-in-out .6s;
  }
  #splash-name {
    font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 600; letter-spacing: .01em;
    color: #f2e8da; opacity: 0; animation: fadeUp .6s ease .7s forwards;
  }
  #splash-tag {
    font-family: 'Inter', system-ui, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .3em;
    color: #b3852a; opacity: 0; animation: fadeUp .6s ease .9s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 8px #e0b24e); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    #splash-path { animation: none; stroke-dashoffset: 0; }
    #splash-name, #splash-tag { animation: none; opacity: 1; }
    #splash { animation: splashOut .4s ease 1s forwards; }
  }
</style>
<script>
  // Filet de sécurité : retire complètement le splash du DOM après l'animation.
  setTimeout(function(){ var s=document.getElementById('splash'); if(s) s.remove(); }, 2200);
</script>

.quest:hover { transform: translateY(-3px); border-color: #6a5a4a !important; box-shadow: 0 8px 24px -12px rgba(0,0,0,.6); }
.qTuto:hover { background: rgba(242,207,91,0.2) !important; transform: scale(1.12); }
.sr-rankcard { position: relative; }
.sr-rankcard::before { content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none; background: radial-gradient(120% 80% at 50% -20%, rgba(242,207,91,0.10), transparent 60%); }
.sr-rankcard::after { content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none; border-top: 1px solid rgba(242,207,91,0.22); }
.sr-tier { font-family: var(--font-display); font-weight: 900 !important; letter-spacing: -0.015em !important; }
.tab-pill { transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease; }
.tab-pill:hover { transform: translateY(-1px); border-color: #6a5a4a; }
.quest:focus-visible { outline: 2px solid #f2cf5b; outline-offset: 2px; }
/* apparition en cascade des cartes */
@keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.quest-in { animation: cardIn .4s cubic-bezier(.2,.8,.2,1) both; }
/* pulse quand une qu\xEAte vient d'\xEAtre valid\xE9e */
@keyframes validPulse { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }
.quest-just { animation: validPulse .45s ease; }
/* LP qui volent vers la barre */
@keyframes lpFly { 0% { opacity: 0; transform: translateY(0) scale(.8); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-60px) scale(1.1); } }
.lp-fly { position: fixed; z-index: 95; pointer-events: none; font-family: 'Inter', system-ui, sans-serif; font-weight: 800; font-size: 20px; color: #f2cf5b; text-shadow: 0 2px 8px rgba(0,0,0,.6); animation: lpFly 1s ease-out forwards; }
/* barre de LP : surpiq\xFBre qui brille au remplissage */
.lp-fill { position: relative; overflow: hidden; }
.lp-fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: translateX(-100%); animation: shimmer 2.4s ease-in-out infinite; }
@keyframes shimmer { 0% { transform: translateX(-100%); } 60%,100% { transform: translateX(200%); } }
/* \xE9cran de promotion */
@keyframes promoBgIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes promoPop { 0% { opacity: 0; transform: scale(.6) translateY(20px); } 55% { opacity: 1; transform: scale(1.08); } 100% { transform: scale(1); } }
@keyframes badgeSpin { 0% { transform: rotateY(0) scale(.8); opacity: 0; } 60% { opacity: 1; } 100% { transform: rotateY(360deg) scale(1); opacity: 1; } }
.promo-badge-anim { animation: badgeSpin 1s cubic-bezier(.2,.8,.2,1) both; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }
.spawn-toast { animation: toastIn .4s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) {
  .floaty, .quest, .quest-in, .quest-just, .lp-fill::after, .promo-badge-anim { animation: none !important; transition: none !important; }
  .lp-fill::after { display: none; }
}
/* mobile : la carte de rang reste le h\xE9ros, tout respire */
@media (max-width: 600px) {
  .sr-root { padding: 18px 14px 48px !important; }
  .sr-h1 { font-size: 30px !important; }
  .sr-rankcard { flex-direction: column !important; text-align: center; padding: 20px !important; }
  .sr-rankcard .sr-rankinfo { width: 100%; }
  .sr-badge { margin: 0 auto; }
  .sr-tier { font-size: 28px !important; }
  .sr-grid { grid-template-columns: 1fr !important; }
  .sr-ladder { justify-content: center; }
  .sr-lprow { justify-content: center; }
}
