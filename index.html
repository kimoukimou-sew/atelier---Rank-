<style>
  #splash {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(circle at 50% 40%, #1c2436, #0b0d12 75%);
    display: flex; align-items: center; justify-content: center;
    animation: splashOut .5s ease 1.5s forwards;
  }
  #splash-inner { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #splash-logo { width: 128px; height: 128px; filter: drop-shadow(0 0 18px rgba(111,168,255,.35)); }
  #splash-path {
    stroke-dasharray: 1; stroke-dashoffset: 1;
    animation: draw 1.2s cubic-bezier(.6,.05,.3,.95) forwards, glow 1.6s ease-in-out .6s;
  }
  #splash-name {
    font-family: Georgia, 'Times New Roman', serif; font-size: 30px; letter-spacing: .04em;
    color: #eaf2ff; opacity: 0; animation: fadeUp .6s ease .7s forwards;
  }
  #splash-tag {
    font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .3em;
    color: #6f89b8; opacity: 0; animation: fadeUp .6s ease .9s forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 8px #6fa8ff); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes splashOut { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) {
    #splash-path { animation: none; stroke-dashoffset: 0; }
    #splash-name, #splash-tag { animation: none; opacity: 1; }
    #splash { animation: splashOut .4s ease 1s forwards; }
  }
</style>
